<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>teramoのゲームセンター</title>
    <style>
        body {
            text-align: center;
            font-family: sans-serif;
            background-color: #2c3e50; /* 背景色（暗めのブルー） */
            color: white;
        }
        
        /* ボタンを並べるエリア */
        .button-area {
            margin: 20px;
            padding: 10px;
            background-color: #34495e;
            border-radius: 8px;
        }

        /* ボタンのデザイン */
        button {
            padding: 12px 24px;
            margin: 5px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background-color: #e74c3c; /* ボタンの色（赤） */
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background-color: #c0392b; /* マウスを乗せた時の色 */
        }

        /* ゲームを表示する枠（埋め込み）のデザイン */
        iframe {
            width: 800px;
            height: 600px;
            border: 4px solid #ecf0f1;
            border-radius: 8px;
            background-color: #000; /* 読み込まれるまでは真っ黒 */
        }
    </style>
</head>
<body>

    <h1>🎮 teramoのゲームセンター 🎮</h1>
    <p>遊びたいゲームのボタンをクリックしてね！</p>

    <!-- ▼▼▼ teramoさんがゲームを追加する場所はここから ▼▼▼ -->
    <div class="button-area">
        
        <!-- サンプル1: 自分のGitHub PagesのURLなどを入れる -->
        <button onclick="changeGame('magic/index.html')">魔法クリエイト</button>
        
        <!-- サンプル2 -->
        <button onclick="changeGame('https://あなたのユーザー名.github.io/ゲーム2のURL/')">パズルゲーム</button>

        <!-- ★新しいゲームを追加したい時は、下の1行をコピーしてURLと名前を書き換えるだけ！★ -->
        <button onclick="changeGame('ファイル名/index.html')">ボタン名</button>

    </div>
    <!-- ▲▲▲ teramoさんがゲームを追加する場所はここまで ▲▲▲ -->

    <!-- ここにゲームが読み込まれます（最初は何も読み込まない設定） -->
    <iframe id="gameWindow" src="about:blank"></iframe>

    <script>
        // ボタンを押すと、iframeのURLを書き換えてゲームを読み込むプログラム
        function changeGame(gameUrl) {
            document.getElementById("gameWindow").src = gameUrl;
        }
    </script>

</body>
</html>
